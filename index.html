<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>TaskTrek | Student Goal Planner</title><link rel="stylesheet" href="style.css"></head><body><main class="app"><header><div><span class="eyebrow">STUDENT PRODUCTIVITY HUB</span><h1>🚀 TaskTrek</h1><p>Plan your tasks. Reach your goals. One step at a time.</p></div><button id="themeBtn" aria-label="Toggle dark mode">🌙 Theme</button></header><section class="stats"><article><strong id="total">0</strong><span>Total tasks</span></article><article><strong id="done">0</strong><span>Completed</span></article><article><strong id="pending">0</strong><span>Pending</span></article><article><strong id="rate">0%</strong><span>Progress</span></article></section><section class="panel"><h2>Add a task</h2><form id="taskForm"><input id="taskName" placeholder="e.g. Revise matrices chapter" maxlength="100" required aria-label="Task name"><select id="category" aria-label="Category"><option>Study</option><option>Assignment</option><option>Personal</option><option>Project</option></select><select id="priority" aria-label="Priority"><option>Medium</option><option>High</option><option>Low</option></select><input type="date" id="due" aria-label="Due date"><button type="submit">+ Add Task</button></form></section><section class="panel"><div class="sectionHead"><h2>My tasks</h2><select id="filter" aria-label="Filter tasks"><option value="all">All tasks</option><option value="pending">Pending</option><option value="completed">Completed</option></select></div><div class="progress"><div id="progressBar"></div></div><ul id="taskList"></ul><p id="empty">No tasks here yet. Add your first task above!</p></section><footer>Made for students • Data saved in this browser</footer></main><script src="script.js"></script></body></html>
